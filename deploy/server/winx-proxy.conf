# Winx: maintained from winx-app/deploy/server, outside NPM Proxy Hosts.
map $http_upgrade $winx_connection_upgrade {
    default upgrade;
    '' close;
}
log_format winx_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';
server {
    listen 80;
    listen [::]:80;
    server_name winx.emilkalimullin.com;
    include conf.d/include/letsencrypt-acme-challenge.conf;
    location / { return 301 https://winx.emilkalimullin.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name winx.emilkalimullin.com;
    ssl_certificate /etc/letsencrypt/live/winx.emilkalimullin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/winx.emilkalimullin.com/privkey.pem;
    include conf.d/include/ssl-cache.conf;
    include conf.d/include/ssl-ciphers.conf;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $winx_frontend winx-frontend:80;
    client_max_body_size 20m;
    access_log /data/logs/winx_access.log winx_safe;
    error_log /data/logs/winx_error.log warn;
    location / {
        proxy_pass http://$winx_frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $winx_connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 3600s;
    }
}
