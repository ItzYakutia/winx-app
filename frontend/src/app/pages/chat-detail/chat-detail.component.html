<main class="chat-page">
  <header class="chat-topbar">
    <a href="/chats" class="back-btn" aria-label="Назад к чатам"
      ><app-icon name="back" [size]="18" /><span>Назад</span></a
    >
    <div>
      <h1 class="chat-title">Переписка</h1>
    </div>
    <app-icon name="chat" [size]="20" class="chat-heading-icon" />
  </header>
  <div *ngIf="loading" class="spinner" aria-label="Загрузка сообщений"></div>
  <div *ngIf="!loading" class="messages-container">
    <div
      class="message"
      *ngFor="let msg of messages"
      [class.mine]="isMine(msg)"
      [class.theirs]="!isMine(msg)"
    >
      <div class="bubble">{{ msg.content }}</div>
      <time class="msg-time">{{ msg.created_at | date: 'shortTime' }}</time>
    </div>
    <div #messagesEnd></div>
  </div>
  <div class="chat-input-area">
    <input
      type="text"
      class="chat-input"
      placeholder="Сообщение…"
      aria-label="Сообщение"
      [(ngModel)]="newMessage"
      (keyup.enter)="send()"
    /><button
      class="send-btn"
      (click)="send()"
      [disabled]="!newMessage.trim()"
      aria-label="Отправить сообщение"
    >
      <app-icon name="send" [size]="20" />
    </button>
  </div>
</main>
