<main class="page">
  <header class="screen-heading">
    <h1>Уведомления</h1>
    <a class="icon-button" routerLink="/chats" aria-label="Назад к общению"
      ><app-icon name="back" [size]="21"
    /></a>
  </header>
  <div *ngIf="loading" class="spinner" aria-label="Загрузка уведомлений"></div>
  <section *ngIf="!loading && notifications.length === 0" class="empty-state">
    <h3>Ничего нового</h3>
  </section>
  <div *ngIf="!loading && notifications.length" class="communication-list">
    <article class="communication-row notification-row" *ngFor="let notif of notifications">
      <span class="notification-icon"><app-icon [name]="getIcon(notif.type)" [size]="20" /></span>
      <div class="row-details">
        <h2>{{ notif.subject }}</h2>
        <time>{{ notif.created_at | date: 'dd.MM, HH:mm' }}</time>
        <details *ngIf="notif.body">
          <summary>Подробнее</summary>
          <p>{{ notif.body }}</p>
        </details>
      </div>
      <button
        class="icon-button quiet-action"
        (click)="delete(notif)"
        aria-label="Удалить уведомление"
      >
        <app-icon name="close" [size]="17" />
      </button>
    </article>
  </div>
</main>
