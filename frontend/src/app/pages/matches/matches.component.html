<main class="page">
  <header class="screen-heading">
    <h1>Общение</h1>
    <a class="icon-button" routerLink="/notifications" aria-label="Уведомления"
      ><app-icon name="bell" [size]="21"
    /></a>
  </header>
  <nav class="local-tabs" aria-label="Общение">
    <a routerLink="/chats">Чаты</a
    ><a routerLink="/matches" class="selected" aria-current="page">Совпадения</a>
  </nav>
  <div *ngIf="error" class="error-msg" role="alert">
    {{ error }}<button class="btn btn-ghost" (click)="load()">Повторить</button>
  </div>
  <div *ngIf="loading" class="spinner" aria-label="Загрузка совпадений"></div>
  <section *ngIf="!loading && !error && matches.length === 0" class="empty-state">
    <div class="empty-icon"><app-icon name="heart" [size]="24" /></div>
    <h3>Всё впереди</h3>
    <p>Взаимные симпатии появятся здесь.</p>
    <a class="btn btn-primary mt-24" routerLink="/discover">Смотреть людей</a>
  </section>
  <div *ngIf="!loading && matches.length" class="communication-list">
    <article class="communication-row" *ngFor="let match of matches">
      <span class="avatar" aria-hidden="true">{{ (match.name || '?').charAt(0) }}</span>
      <div class="row-details">
        <h2>{{ match.name || 'Новый знакомый' }}</h2>
        <time>{{ match.created_at | date: 'dd.MM' }}</time>
      </div>
      <button
        class="icon-button"
        [disabled]="!getChatId(match)"
        (click)="openChat(match)"
        [attr.aria-label]="'Написать: ' + match.name"
      >
        <app-icon name="chat" [size]="20" />
      </button>
      <button
        class="icon-button quiet-action"
        (click)="unmatch(match)"
        [attr.aria-label]="'Убрать совпадение: ' + match.name"
      >
        <app-icon name="close" [size]="17" />
      </button>
    </article>
  </div>
</main>
